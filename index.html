<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REBICONN — Coming Soon</title>

  <style>
    :root {
      --bg: #0B1C2D;
      --bg-dark: #070E17;
      --text: #ffffff;
      --muted: rgba(255,255,255,0.65);
      --accent: #6EE7F5;
      --border: rgba(255,255,255,0.12);
      --radius: 18px;
      --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 20% 20%, rgba(110,231,245,0.12), transparent 55%),
        radial-gradient(800px 500px at 80% 30%, rgba(110,231,245,0.08), transparent 55%),
        linear-gradient(180deg, var(--bg-dark), var(--bg));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 820px;
      padding: 48px 24px;
      text-align: center;
    }

    /* Logo */
    .logo {
      margin-bottom: 28px;
    }

    .logo img {
      max-width: 180px;
      height: auto;
    }

    /* Headline */
    h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0 0 14px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 36px;
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 3px;
      margin: 28px auto 36px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 999px;
    }

    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .time-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      min-width: 88px;
    }

    .time-box span {
      display: block;
      font-size: 22px;
      font-weight: 700;
    }

    .time-box small {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Footer text */
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Logo -->
    <div class="logo">
      <img src="REBICONN_Logo.png" alt="REBICONN logo">
    </div>

    <!-- Headline -->
    <h1>Something Important Is Coming</h1>

    <p>
      We’re building intelligent systems for industries where
      <strong>precision, trust, and scale</strong> truly matter.
    </p>

    <div class="divider"></div>

    <!-- Countdown -->
    <div class="countdown">
      <div class="time-box">
        <span id="days">—</span>
        <small>Days</small>
      </div>
      <div class="time-box">
        <span id="hours">—</span>
        <small>Hours</small>
      </div>
      <div class="time-box">
        <span id="minutes">—</span>
        <small>Minutes</small>
      </div>
      <div class="time-box">
        <span id="seconds">—</span>
        <small>Seconds</small>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      © <span id="year"></span> REBICONN — Launching Soon
    </div>

  </div>

  <script>
    // ===== CONFIGURE LAUNCH DATE =====
    const launchDate = new Date("2026-03-01T10:00:00").getTime();

    const d = document.getElementById("days");
    const h = document.getElementById("hours");
    const m = document.getElementById("minutes");
    const s = document.getElementById("seconds");
    document.getElementById("year").textContent = new Date().getFullYear();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance <= 0) {
        d.textContent = h.textContent = m.textContent = s.textContent = "00";
        return;
      }

      d.textContent = Math.floor(distance / (1000 * 60 * 60 * 24));
      h.textContent = Math.floor((distance / (1000 * 60 * 60)) % 24);
      m.textContent = Math.floor((distance / (1000 * 60)) % 60);
      s.textContent = Math.floor((distance / 1000) % 60);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
